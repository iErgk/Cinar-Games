<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çınar Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center}
h1{color:#00ff99;margin:12px}
#info{font-size:20px;margin:8px}
canvas{background:#444;border:3px solid white;width:min(94vw,360px);height:auto;max-height:65vh}
.controls{display:flex;justify-content:center;gap:25px;margin:12px}
button{font-size:22px;padding:14px 25px;border:0;border-radius:12px;background:#00ff99;color:#111;font-weight:bold}
#start{font-size:18px}
</style>
</head>
<body>
<h1>🏁 ÇINAR RACING</h1>
<div id="info">Puan: <span id="score">0</span></div>
<canvas id="game" width="360" height="600"></canvas>
<div class="controls">
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>
<button id="start">OYUNU BAŞLAT</button>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreText=document.getElementById("score");
let player={x:155,y:490,w:48,h:80};
let rivals=[],score=0,running=false,frame=0;
let left=false,right=false;

function car(x,y,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,48,80);
 ctx.fillStyle="#111";
 ctx.fillRect(x+6,y+12,10,18);
 ctx.fillRect(x+32,y+12,10,18);
 ctx.fillRect(x+6,y+52,10,18);
 ctx.fillRect(x+32,y+52,10,18);
 ctx.fillStyle="#bdeaff";
 ctx.fillRect(x+10,y+20,28,20);
}

function drawRoad(){
 ctx.fillStyle="#287a38";
 ctx.fillRect(0,0,360,600);
 ctx.fillStyle="#444";
 ctx.fillRect(35,0,290,600);
 ctx.fillStyle="white";
 ctx.fillRect(35,0,5,600);
 ctx.fillRect(320,0,5,600);
 ctx.fillStyle="#fff";
 for(let y=(frame*7)%80-80;y<600;y+=80)
  ctx.fillRect(176,y,8,42);
}

function endGame(){
 running=false;
 alert("Oyun bitti! Puanın: "+score);
}

function loop(){
 if(!running)return;
 frame++;
 drawRoad();
 if(left)player.x-=5;
 if(right)player.x+=5;
 player.x=Math.max(45,Math.min(267,player.x));

 if(frame%55===0){
  let lanes=[55,120,195,255];
  rivals.push({x:lanes[Math.floor(Math.random()*lanes.length)],y:-85});
 }
 for(let r of rivals){
  r.y+=5;
  if(player.x<r.x+48&&player.x+48>r.x&&
     player.y<r.y+80&&player.y+80>r.y){
    endGame();return;
  }
  car(r.x,r.y,"#ff3434");
 }
 rivals=rivals.filter(r=>r.y<650);
 car(player.x,player.y,"#00d9ff");
 if(frame%10===0){score++;scoreText.textContent=score;}
 requestAnimationFrame(loop);
}

function startGame(){
 player.x=155;rivals=[];score=0;frame=0;
 scoreText.textContent=0;running=true;loop();
}
document.getElementById("start").onclick=()=>{
 if(!running)startGame();
};
function hold(id,set){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();set(true)});
 b.addEventListener("pointerup",()=>set(false));
 b.addEventListener("pointerleave",()=>set(false));
 b.addEventListener("pointercancel",()=>set(false));
}
hold("left",v=>left=v);
hold("right",v=>right=v);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=true;
 if(e.key==="ArrowRight"||e.key==="d")right=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=false;
 if(e.key==="ArrowRight"||e.key==="d")right=false;
});
drawRoad();
car(player.x,player.y,"#00d9ff");
</script>
</body>
</html>
