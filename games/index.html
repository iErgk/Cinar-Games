
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Çınar Games - Yarış</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;color:white;font-family:Arial;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
header{height:48px;display:flex;justify-content:space-around;align-items:center;background:#111;font-weight:bold}
canvas{display:block;width:100%;height:calc(100% - 150px);background:#287d36}
#controls{height:102px;display:flex;gap:14px;justify-content:center;align-items:center;background:#202020}
button{border:0;border-radius:18px;background:#ffb000;color:#111;font-weight:bold;font-size:23px;min-width:110px;height:68px;touch-action:none;-webkit-user-select:none}
#message{position:fixed;display:none;inset:25% 8% auto;background:#111e;padding:24px;border:2px solid gold;border-radius:20px;text-align:center}
#message button{font-size:18px;height:50px;margin-top:12px}
</style>
</head>
<body>
<header>
 <span>🏁 ÇINAR RACE</span>
 <span>🏆 <b id="score">0</b></span>
 <span>⭐ Rekor: <b id="best">0</b></span>
</header>
<canvas id="game"></canvas>
<div id="controls">
 <button id="left">⬅ SOL</button>
 <button id="right">SAĞ ➡</button>
</div>
<div id="message">
 <h2 id="result">🏆 OYUN BİTTİ!</h2>
 <p id="final"></p>
 <button id="restart">🔄 TEKRAR OYNA</button>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W=0,H=0,playerX=0,traffic=[],score=0,best=Number(localStorage.getItem('cinarRaceBest')||0);
let running=true,left=false,right=false,roadOffset=0,last=0,spawn=0,speed=4;
bestEl.textContent=best;

function resize(){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;
 ctx.setTransform(d,0,0,d,0,0);
 playerX=Math.max(24,Math.min(W-24,playerX||W/2));
}
addEventListener('resize',resize);resize();
function car(x,y,w,h,color){
 ctx.fillStyle='#111';ctx.fillRect(x-w*.58,y+h*.18,w*.18,h*.25);
 ctx.fillRect(x+w*.4,y+h*.18,w*.18,h*.25);
 ctx.fillRect(x-w*.58,y+h*.65,w*.18,h*.25);
 ctx.fillRect(x+w*.4,y+h*.65,w*.18,h*.25);
 ctx.fillStyle=color;ctx.fillRect(x-w/2,y,w,h);
 ctx.fillStyle='#9ce7ff';ctx.fillRect(x-w*.32,y+h*.18,w*.64,h*.25);
 ctx.fillStyle='#222';ctx.fillRect(x-w*.32,y+h*.52,w*.64,h*.23);
 ctx.fillStyle='#fff6a0';ctx.fillRect(x-w*.4,y+h*.05,w*.2,h*.08);
 ctx.fillRect(x+w*.2,y+h*.05,w*.2,h*.08);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#287d36';ctx.fillRect(0,0,W,H);
 const rw=Math.min(W*.78,430),rx=(W-rw)/2;
 ctx.fillStyle='#555';ctx.fillRect(rx,0,rw,H);
 ctx.fillStyle='#eee';ctx.fillRect(rx+5,0,4,H);ctx.fillRect(rx+rw-9,0,4,H);
 ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([30,24]);
 ctx.lineDashOffset=-roadOffset;
 ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
 for(let y=-20;y<H;y+=70){
  let yy=(y+roadOffset*2)%(H+70);
  ctx.fillStyle='#145d26';ctx.beginPath();ctx.arc(rx-20,yy,9,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(rx+rw+20,yy,9,0,7);ctx.fill();
 }
 const cw=Math.max(29,Math.min(42,rw*.12)),ch=cw*1.65;
 traffic.forEach(t=>car(t.x,t.y,cw,ch,t.color));
 car(playerX,H-ch-12,cw,ch,'#ff3030');
}
let audio=null,engineOsc=null,engineGain=null;
function initAudio(){
 if(audio){if(audio.state==='suspended')audio.resume();return}
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  engineOsc=audio.createOscillator();engineGain=audio.createGain();
  engineOsc.type='sawtooth';engineOsc.frequency.value=75;
  engineGain.gain.value=0.015;
  engineOsc.connect(engineGain);engineGain.connect(audio.destination);engineOsc.start();
 }catch(e){}
}
function beep(freq,duration,type='sine',volume=.15){
 if(!audio)return;
 try{
  let o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=volume;
  o.connect(g);g.connect(audio.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.stop(audio.currentTime+duration);
 }catch(e){}
}
function crashSound(){
 if(!audio)return;
 beep(95,.5,'sawtooth',.3);setTimeout(()=>beep(55,.35,'square',.2),100);
}
function trophySound(){beep(523,.18);setTimeout(()=>beep(659,.18),160);setTimeout(()=>beep(784,.3),320)}
function finish(){
 if(!running)return;
 running=false;crashSound();
 document.getElementById('message').style.display='block';
 document.getElementById('result').textContent='💥 KAZA YAPTIN!';
 document.getElementById('final').textContent='Puanın: '+score+' | Rekor: '+best;
 if(engineGain)engineGain.gain.setTargetAtTime(0,audio.currentTime,.1);
}
function update(dt){
 if(!running)return;
 const step=Math.min(dt/16.67,2);
 speed=4+Math.min(score/120,5);
 if(left)playerX-=5*step;
 if(right)playerX+=5*step;
 const rw=Math.min(W*.78,430),rx=(W-rw)/2,cw=Math.max(29,Math.min(42,rw*.12)),ch=cw*1.65;
 playerX=Math.max(rx+cw*.7,Math.min(rx+rw-cw*.7,playerX));
 roadOffset=(roadOffset+speed*step)%54;
 spawn+=dt;
 if(spawn>950){spawn=0;let lanes=[rx+rw*.28,rx+rw*.72];traffic.push({x:lanes[Math.random()<.5?0:1],y:-ch,color:['#29aaff','#ffd329','#b65cff','#eeeeee'][Math.floor(Math.random()*4)]})}
 traffic.forEach(t=>t.y+=speed*step);
 traffic=traffic.filter(t=>t.y<H+80);
 for(const t of traffic){
  if(Math.abs(t.x-playerX)<cw*.82&&Math.abs(t.y-(H-ch-12))<ch*.82){finish();break}
 }
 score+=Math.floor(step);
 scoreEl.textContent=score;
 if(engineOsc)engineOsc.frequency.setTargetAtTime(65+speed*7,audio.currentTime,.1);
 if(score>best&&score%10===0){best=score;bestEl.textContent=best;localStorage.setItem('cinarRaceBest',best)}
 if(score>0&&score%500===0){trophySound()}
}
function loop(now){if(!last)last=now;let dt=now-last;last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function hold(id,which){
 const b=document.getElementById(id);
 const on=e=>{e.preventDefault();initAudio();if(which==='left')left=true;else right=true};
 const off=e=>{e.preventDefault();if(which==='left')left=false;else right=false};
 b.addEventListener('pointerdown',on);
 b.addEventListener('pointerup',off);
 b.addEventListener('pointercancel',off);
 b.addEventListener('pointerleave',off);
}
hold('left','left');hold('right','right');
document.getElementById('restart').addEventListener('click',()=>{
 initAudio();score=0;traffic=[];spawn=0;running=true;last=0;
 scoreEl.textContent='0';document.getElementById('message').style.display='none';
 if(engineGain)engineGain.gain.setTargetAtTime(.015,audio.currentTime,.1);
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
