<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çınar Games</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 38px 15px;
  background: linear-gradient(135deg, #172554, #7028c7);
}
h1 {
  font-size: 36px;
  margin: 0;
}
header p {
  color: #ddd;
}
main {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}
h2 {
  color: #a99aff;
}
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}
.card {
  background: #171e33;
  border: 1px solid #343e60;
  border-radius: 18px;
  padding: 22px;
  text-align: center;
}
.car {
  font-size: 65px;
}
button {
  background: #7547ff;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 14px 24px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}
button:active {
  transform: scale(0.97);
}
footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}
</style>
</head>
<body>
<header>
  <h1>🎮 ÇINAR GAMES</h1>
  <p>Oyun dünyama hoş geldin!</p>
</header>
<main>
  <h2>🏁 Oyunlar</h2>
  <div class="games">
    <div class="card">
      <div class="car">🏎️</div>
      <h3>Çınar Racing V3</h3>
      <p>Direksiyona geç ve puan topla!</p>
      <button onclick="location.href='/Cinar-Games/games/index.html'">
        OYNA
      </button>
    </div>
    <div class="card">
      <div class="car">🧟</div>
      <h3>Zombi Dünyası</h3>
      <p>Yakında!</p>
      <button onclick="alert('Yakında!')">YAKINDA</button>
    </div>
    <div class="card">
      <div class="car">🌍</div>
      <h3>Açık Dünya</h3>
      <p>Yeni maceralar yakında!</p>
      <button onclick="alert('Yakında!')">YAKINDA</button>
    </div>
  </div>
</main>
<footer>© 2026 Çınar Games</footer>
</body>
</html>
