<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Çınar Games - Racing</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:#071018;color:white;font-family:Arial;text-align:center;overflow:hidden}
h1{margin:10px;color:#00ffc3;letter-spacing:2px}
#hud{display:flex;justify-content:space-around;font-weight:bold;font-size:18px;margin:10px}
canvas{display:block;width:min(100vw,420px);height:auto;max-height:68vh;margin:auto;border:2px solid #00ffc3;border-radius:10px}
.controls{display:flex;justify-content:space-around;align-items:center;margin:10px auto;max-width:420px}
button{border:2px solid #00ffc3;background:#101e2a;color:white;border-radius:15px;padding:15px 24px;font-size:25px;font-weight:bold}
#start{font-size:17px;padding:12px 24px;background:#00ffc3;color:#061018}
#msg{font-size:14px;color:#a9c5d4;margin:5px}
</style>
</head>
<body>
<h1>🏁 ÇINAR GAMES</h1>
<div id="hud">
<span>PUAN: <b id="score">0</b></span>
<span>REKOR: <b id="best">0</b></span>
</div>
<canvas id="game" width="360" height="520"></canvas>
<div class="controls">
<button id="left">⬅</button>
<button id="right">➡</button>
</div>
<button id="start">🏎️ OYUNU BAŞLAT</button>
<div id="msg">Rakip araçlardan kaç!</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
let player={x:156,y:410,w:48,h:78};
let rivals=[],score=0,frame=0,running=false;
let left=false,right=false,speed=4;
let best=0;
try{best=Number(localStorage.getItem("cinarBest")||0)}catch(e){}
bestEl.textContent=best;

function drawCar(x,y,color,playerCar=false){
 ctx.save();
 // Gölge
 ctx.fillStyle="rgba(0,0,0,.4)";
 ctx.beginPath();ctx.ellipse(x+24,y+73,27,7,0,0,Math.PI*2);ctx.fill();

 // Tekerlekler
 ctx.fillStyle="#101216";
 ctx.fillRect(x-4,y+14,9,20);
 ctx.fillRect(x+43,y+14,9,20);
 ctx.fillRect(x-4,y+48,9,20);
 ctx.fillRect(x+43,y+48,9,20);

 // Spor araba gövdesi
 let g=ctx.createLinearGradient(x,y,x+48,y);
 g.addColorStop(0,"#252a32");
 g.addColorStop(.25,color);
 g.addColorStop(.65,color);
 g.addColorStop(1,"#161b23");
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(x+11,y+2);
 ctx.quadraticCurveTo(x+24,y-2,x+37,y+2);
 ctx.lineTo(x+46,y+17);
 ctx.lineTo(x+48,y+57);
 ctx.lineTo(x+40,y+75);
 ctx.quadraticCurveTo(x+24,y+80,x+8,y+75);
 ctx.lineTo(x,y+57);
 ctx.lineTo(x+2,y+17);
 ctx.closePath();ctx.fill();

 // Camlar
 ctx.fillStyle="#102a3b";
 ctx.beginPath();
 ctx.moveTo(x+13,y+15);ctx.lineTo(x+35,y+15);
 ctx.lineTo(x+40,y+32);ctx.lineTo(x+8,y+32);
 ctx.closePath();ctx.fill();
 ctx.fillStyle="#31576a";
 ctx.fillRect(x+10,y+19,3,10);
 ctx.fillRect(x+35,y+19,3,10);

 // Kaput ve orta çizgi
 ctx.fillStyle="rgba(255,255,255,.18)";
 ctx.beginPath();ctx.moveTo(x+9,y+36);ctx.lineTo(x+39,y+36);
 ctx.lineTo(x+35,y+53);ctx.lineTo(x+13,y+53);ctx.closePath();ctx.fill();

 // Farlar
 ctx.fillStyle=playerCar?"#d7ffff":"#fff3cf";
 ctx.fillRect(x+5,y+5,10,4);
 ctx.fillRect(x+33,y+5,10,4);

 // Arka stop lambaları
 ctx.fillStyle="#ff173b";
 ctx.fillRect(x+5,y+63,12,5);
 ctx.fillRect(x+31,y+63,12,5);
 ctx.fillStyle="#aaa";
 ctx.fillRect(x+12,y+73,7,3);
 ctx.fillRect(x+29,y+73,7,3);

 if(playerCar){
  ctx.fillStyle="#fff";
  ctx.fillRect(x+22,y+38,4,13);
 }
 ctx.restore();
}

function road(){
 let gr=ctx.createLinearGradient(0,0,360,0);
 gr.addColorStop(0,"#172c29");
 gr.addColorStop(.5,"#343b40");
 gr.addColorStop(1,"#172c29");
 ctx.fillStyle=gr;ctx.fillRect(0,0,360,520);

 // Yol kenarları
 ctx.fillStyle="#e7eeee";
 ctx.fillRect(33,0,4,520);ctx.fillRect(323,0,4,520);
 ctx.fillStyle="#00ffc3";
 ctx.fillRect(38,0,2,520);ctx.fillRect(320,0,2,520);

 // Kesik yol çizgileri
 ctx.fillStyle="#e4e7e9";
 for(let y=(frame*speed*1.5)%80-80;y<520;y+=80){
  ctx.fillRect(105,y,5,40);
  ctx.fillRect(250,y,5,40);
 }
 // Yol ışıkları
 for(let y=(frame*speed*1.5)%130-130;y<520;y+=130){
  ctx.fillStyle="#ffdf9e";
  ctx.fillRect(12,y+20,5,15);
  ctx.fillRect(343,y+20,5,15);
 }
}

function startGame(){
 player.x=156;rivals=[];score=0;frame=0;speed=4;
 scoreEl.textContent=score;running=true;
 document.getElementById("start").textContent="YENİDEN BAŞLAT";
 document.getElementById("msg").textContent="Rakiplerden kaç!";
 loop();
}

function loop(){
 if(!running)return;
 frame++;
 road();

 if(left)player.x-=5;
 if(right)player.x+=5;
 player.x=Math.max(43,Math.min(269,player.x));

 if(frame%48===0){
  const lanes=[48,118,194,264];
  let lane=lanes[Math.floor(Math.random()*lanes.length)];
  rivals.push({x:lane,y:-85,color:["#ff3030","#ffbf27","#bd65ff","#f4f4f4"][Math.floor(Math.random()*4)]});
 }
 for(const r of rivals){
  r.y+=speed;
  drawCar(r.x,r.y,r.color);
  if(player.x<r.x+48&&player.x+48>r.x&&
     player.y<r.y+75&&player.y+75>r.y){
   running=false;
   if(score>best){
    best=score;bestEl.textContent=best;
    try{localStorage.setItem("cinarBest",best)}catch(e){}
   }
   document.getElementById("msg").textContent="🏁 Oyun bitti! Puan: "+score;
   document.getElementById("start").textContent="TEKRAR OYNA";
   return;
  }
 }
 rivals=rivals.filter(r=>r.y<540);
 drawCar(player.x,player.y,"#078dff",true);

 if(frame%8===0){
  score++;scoreEl.textContent=score;
  if(score%100===0)speed=Math.min(7,speed+.3);
 }
 requestAnimationFrame(loop);
}

function control(id,fn){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();fn(true)});
 for(const ev of ["pointerup","pointerleave","pointercancel"])
  b.addEventListener(ev,()=>fn(false));
}
control("left",v=>left=v);
control("right",v=>right=v);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=true;
 if(e.key==="ArrowRight"||e.key==="d")right=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=false;
 if(e.key==="ArrowRight"||e.key==="d")right=false;
});
document.getElementById("start").onclick=startGame;
road();
drawCar(player.x,player.y,"#078dff",true);
</script>
</body>
</html>
